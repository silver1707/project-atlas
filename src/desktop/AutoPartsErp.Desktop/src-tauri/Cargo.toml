[package]
name = "autoparts-erp-desktop"
version = "0.1.0"
description = "ERP local desktop para autopecas"
authors = ["AutoParts ERP"]
edition = "2021"

[lib]
name = "autoparts_erp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
keyring = "3"
