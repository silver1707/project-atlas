name: autoparts-erp-local

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoparts_erp}
      POSTGRES_USER: ${POSTGRES_USER:-autoparts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoparts_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - shared_preload_libraries=pg_stat_statements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/AutoPartsErp.Api/Dockerfile
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-autoparts_erp};Username=${POSTGRES_USER:-autoparts};Password=${POSTGRES_PASSWORD:-autoparts_dev_password}
      LocalAuthentication__SigningKey: ${LOCAL_AUTH_SIGNING_KEY:-development-only-change-this-local-erp-signing-key-64-bytes}
      Atlas__InstallationProfile: development
      Atlas__ApplyMigrationsOnStartup: "false"
      Atlas__EnableRedis: "false"
      Atlas__EnableRabbitMq: "false"
      Atlas__EnableOpenTelemetry: "false"
      Atlas__ImmutableXmlStoragePath: /var/lib/autoparts-erp/fiscal-xml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:8080"
    volumes:
      - fiscal-xml:/var/lib/autoparts-erp/fiscal-xml

  redis:
    image: redis:7.4-alpine
    profiles: ["advanced"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    profiles: ["advanced"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-autoparts}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-autoparts_dev_password}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.126.0
    profiles: ["advanced"]
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./deploy/otel-collector.yml:/etc/otelcol/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["advanced"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["advanced"]
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  grafana-data:
  fiscal-xml:
