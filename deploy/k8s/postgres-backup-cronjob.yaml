apiVersion: batch/v1
kind: CronJob
metadata:
  name: atlas-postgres-basebackup
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-basebackup
              image: postgres:17
              command: ["/bin/sh", "-c"]
              args:
                - pg_basebackup --host="$PGHOST" --username="$PGUSER" --pgdata="/backup/$(date -u +%Y%m%dT%H%M%SZ)" --format=plain --wal-method=stream --checkpoint=fast --progress
              envFrom:
                - secretRef:
                    name: atlas-postgres-backup
              volumeMounts:
                - name: backup
                  mountPath: /backup
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: atlas-postgres-backups
