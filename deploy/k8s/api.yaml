apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  labels:
    app: atlas-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-api
  template:
    metadata:
      labels:
        app: atlas-api
    spec:
      containers:
        - name: api
          image: ghcr.io/atlas-erp/atlas-api:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: atlas-api-secrets
            - configMapRef:
                name: atlas-api-config
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-api
spec:
  selector:
    app: atlas-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
