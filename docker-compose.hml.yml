name: autoparts-erp-store-hml

services:
  api:
    image: ${AUTOPARTS_API_IMAGE:-autoparts-erp-api:local}
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      Atlas__InstallationProfile: store-server
      Atlas__ApplyMigrationsOnStartup: "false"
      Atlas__EnableRedis: ${ENABLE_REDIS:-false}
      Atlas__EnableRabbitMq: ${ENABLE_RABBITMQ:-false}
      Atlas__EnableOpenTelemetry: ${ENABLE_OTEL:-false}
      Atlas__ImmutableXmlStoragePath: /var/lib/autoparts-erp/fiscal-xml
    ports:
      - "5000:8080"
    volumes:
      - fiscal-xml-hml:/var/lib/autoparts-erp/fiscal-xml
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoparts_erp}
      POSTGRES_USER: ${POSTGRES_USER:-autoparts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /wal-archive/%f && cp %p /wal-archive/%f
    ports:
      - "5432:5432"
    volumes:
      - postgres-hml-data:/var/lib/postgresql/data
      - postgres-wal-archive:/wal-archive
    restart: unless-stopped

volumes:
  postgres-hml-data:
  postgres-wal-archive:
  fiscal-xml-hml:
