name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore AutoPartsErp.slnx
      - name: Build
        run: dotnet build AutoPartsErp.slnx -c Release --no-restore
      - name: Test
        run: dotnet test AutoPartsErp.slnx -c Release --no-build --collect:"XPlat Code Coverage" --logger trx
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: "**/TestResults/**/*"

  desktop-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/desktop/AutoPartsErp.Desktop/package-lock.json
      - name: Install
        working-directory: src/desktop/AutoPartsErp.Desktop
        run: npm ci
      - name: Lint
        working-directory: src/desktop/AutoPartsErp.Desktop
        run: npm run lint
      - name: Build renderer
        working-directory: src/desktop/AutoPartsErp.Desktop
        run: npm run build

  desktop-installer:
    runs-on: windows-latest
    needs: [desktop-renderer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/desktop/AutoPartsErp.Desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install
        working-directory: src/desktop/AutoPartsErp.Desktop
        run: npm ci
      - name: Build Windows installer
        working-directory: src/desktop/AutoPartsErp.Desktop
        run: npm run package:windows
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: autoparts-erp-windows-installer
          path: src/desktop/AutoPartsErp.Desktop/src-tauri/target/release/bundle/**/*

  docker-api:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/backend/AutoPartsErp.Api/Dockerfile -t autoparts-erp-api:${{ github.sha }} .

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
